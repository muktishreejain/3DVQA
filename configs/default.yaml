# Windows 11 + CUDA 11.8 + Python 3.10 + PyTorch 2.1.2
seed: 42
device: cuda
dtype: float16
debug: false
use_mock_models: false

paths:
  checkpoints:
    grounding_dino: models/checkpoints/grounding_dino
    sam: models/checkpoints/sam
    depthpro: models/checkpoints/depthpro
    midas: models/checkpoints/midas
    zero123: models/checkpoints/zero123
    omni3d: models/checkpoints/omni3d
    bgnn: models/checkpoints/bgnn
    apc_vlm: models/checkpoints/apc_vlm

detection:
  box_threshold: 0.35
  text_threshold: 0.25
  max_detections: 10

segmentation:
  multimask_output: false

depth:
  backend: depthpro  # depthpro | midas
  normalize: true
  use_query_mask: true

# Block 6: analytic virtual-camera reprojection (replaces Zero123 synthesis)
multiview:
  n_virtual_cams: 12      # cameras placed around the scene centroid; ablate 8/12/16/24

lifting:
  coordinate_frame: camera
  lightweight: true

graph:
  relations:
    - behind
    - in_front_of
    - left_of
    - right_of
    - near
    - far
    - occluded_by
    - overlap
  depth_threshold_near: 0.15
  depth_threshold_behind: 0.08

# Block 5: Bayesian GNN (MC-Dropout epistemic + learned aleatoric)
reasoning:
  num_layers: 3
  hidden_dim: 128
  dropout: 0.3            # higher dropout -> more informative MC variance
  t_mc: 20               # Monte-Carlo dropout passes; ablate 10/20/50

# Block 6 scoring: S(v) = IG(v) - lambda * U(v)
scoring:
  lambda_uncertainty: 0.5  # uncertainty penalty weight; ablate 0/0.25/0.5/1.0

selection:
  top_k: 3

fusion:
  visual_dim: 512
  graph_dim: 128
  text_dim: 768

apc_vlm:
  enabled: true
  run_reasoning: false

pipeline:
  # Image-2 ordering: lift + graph + BGNN uncertainty BEFORE analytic
  # reprojection, so view scoring can use per-node uncertainty.
  stages:
    - detection        # 2 perception
    - segmentation     # 2 perception
    - depth            # 2 perception
    - lifting          # 3 3D lifting
    - graphs           # 4 scene graph
    - bgnn             # 5 Bayesian GNN uncertainty
    - views            # 6 analytic virtual-camera reprojection
    - view_scores      # 6 IG - lambda * U scoring
    - selected_views   # 6 top-k selection
    - graph_cot        # 7 query-guided reasoning path
    - fusion           # 8 feature export
    - apc_vlm          # 8 VLM integration
  save_intermediates: true
  resume: true

logging:
  level: INFO
  log_gpu_memory: true
